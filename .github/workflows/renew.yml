name: JustRunMy 自动续期

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 06:00 (UTC 22:00) 触发
    - cron: '0 22 * * *'

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: 📥 下载代码
      uses: actions/checkout@v4

    - name: 🐍 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 🛡️ 设置代理
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        chmod +x setup_proxy.sh
        ./setup_proxy.sh

    - name: 🛠️ 安装自动化依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: 🚀 运行账号续期
      env:
        # 请确保在 GitHub Secrets 中配置了 EML 和 PWD
        ACC: ${{ secrets.EML }}
        ACC_PWD: ${{ secrets.PWD }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_ID: ${{ secrets.TG_ID }}
      run: |
        echo "开始处理账号续期"
        # 启动虚拟显示器并执行脚本
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python reset_timer.py

  cleanup:
    needs: renew
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: 📥 下载代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: ⏱️ 更新运行记录
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        if [ ! -f time.txt ]; then
          echo "首次生成时间：$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
        else
          echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
        fi
        
        git add time.txt
        
        if git diff --cached --quiet; then
          echo "无变化，无需提交"
        else
          git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin HEAD:main || true
        fi

    - name: 🧹 清理旧的工作流运行记录
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
